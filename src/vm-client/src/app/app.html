<header class="shell-header">
  <div class="shell-container shell-header__row">
    <a
      class="shell-title"
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      >{{ title }}</a
    >
    <nav class="shell-nav" aria-label="Primary">
      <a routerLink="/vending" routerLinkActive="is-active">Vending</a>
      <a routerLink="/products" routerLinkActive="is-active">Products</a>
    </nav>
  </div>
</header>

<main class="shell-container">
  <router-outlet />
</main>
