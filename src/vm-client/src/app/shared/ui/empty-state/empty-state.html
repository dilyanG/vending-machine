<div class="vm-empty-state">
  <div class="vm-empty-state__icon"><ng-content select="[empty-state-icon]" /></div>
  <h3 class="vm-empty-state__title">{{ title() }}</h3>
  @if (message()) {
    <p class="vm-empty-state__message">{{ message() }}</p>
  }
  <div class="vm-empty-state__action"><ng-content select="[empty-state-action]" /></div>
</div>
